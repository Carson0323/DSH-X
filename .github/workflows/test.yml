name: test

# push 不限定分支：fork 里往特性分支推一次就能立刻看到结果，
# 不用等上游仓库批准 fork PR 的工作流运行
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      # 这个项目没有任何 npm 依赖，测试也只用 node 内置模块，所以不需要 npm ci
      - run: npm test
